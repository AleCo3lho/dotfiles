# Profile: work-secondary
# Secondary work laptop. Editor + terminal + window manager + the CLI suite,
# without personal apps, chat clients, or synced app state.
#
# Activated by writing "work-secondary" into ~/.config/.profile (gitignored).

# No "personal" bundle -> no qbittorrent.
BREW_BUNDLES="core dev infra gui"

STOW_PACKAGES="zsh wezterm"

# Single-display layout; see aerospace/hosts/work-secondary.toml.
AEROSPACE_HOST="work-secondary"

# No "rust" step — rustup toolchain install is slow and unused here.
STEPS="xcode homebrew brew zsh_framework stow aerospace tpm node python secrets"

# Only these directories are materialized on disk. Everything else in the repo
# (opencode/, raycast/, weechat/, mole/, ...) stays in the index as
# skip-worktree: pulls and pushes still work, the files just never land here.
SPARSE_PATHS="aerospace brew btop git karabiner lib mdless nvim profiles tests thefuck tmux wezterm zsh"
