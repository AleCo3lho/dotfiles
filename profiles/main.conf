# Profile: main
# The primary personal machine. Everything is enabled.
#
# Activated by writing "main" into ~/.config/.profile (gitignored).

# Homebrew bundles from brew/*.Brewfile, in install order.
BREW_BUNDLES="core dev infra gui personal"

# Stow packages symlinked into $HOME.
STOW_PACKAGES="zsh wezterm"

# Which aerospace/hosts/<name>.toml to activate.
AEROSPACE_HOST="main"

# Bootstrap steps to run. Remove a name to skip that step entirely.
STEPS="xcode homebrew brew zsh_framework stow aerospace tpm node python rust secrets"

# Directories to materialize via git sparse-checkout.
# Empty means "no sparse-checkout" — the full repo is checked out.
SPARSE_PATHS=""
